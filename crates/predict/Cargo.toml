[package]
name = "preempt-predict"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
encoding_rs = { version = "0.8.35", optional = true }
llama-cpp-2 = { version = "=0.1.157", default-features = false, optional = true }
serde_json = "1.0.145"

[features]
default = []
llama = ["dep:encoding_rs", "dep:llama-cpp-2"]

[[bin]]
name = "preempt-model-eval"
path = "src/bin/preempt-model-eval.rs"
required-features = ["llama"]
